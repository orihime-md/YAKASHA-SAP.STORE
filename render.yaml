# Yakasha SAP + WAHA GOWS all-in-one Render Blueprint.
# Render creates the web service and PostgreSQL, generates engine/webhook/session
# secrets, and asks you to choose the real admin password.
services:
  - type: web
    name: yakasha-sap
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Render generates these stable secrets. They are shared by the WAHA
      # process and the Yakasha backend inside this service.
      - key: WAHA_API_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # You choose this password during Blueprint setup / in Render Environment.
      - key: ADMIN_PASSWORD
        sync: false

      # WAHA is bundled in the same container, so no external WAHA URL is needed.
      - key: WAHA_URL
        value: http://127.0.0.1:3000
      - key: WHATSAPP_API_PORT
        value: "3000"
      - key: WHATSAPP_API_HOSTNAME
        value: 127.0.0.1
      - key: WHATSAPP_DEFAULT_ENGINE
        value: GOWS
      - key: WAHA_LOCAL_STORE_BASE_DIR
        value: /app/.sessions
      - key: WHATSAPP_FILES_FOLDER
        value: /app/.media
      - key: WHATSAPP_FILES_LIFETIME
        value: "0"
      - key: WAHA_PRINT_QR
        value: "false"
      - key: WAHA_WORKER_RESTART_SESSIONS
        value: "true"
      - key: WHATSAPP_RESTART_ALL_SESSIONS
        value: "true"
      - key: WAHA_DASHBOARD_ENABLED
        value: "false"
      - key: WHATSAPP_SWAGGER_ENABLED
        value: "false"
      - key: WAHA_READY_TIMEOUT_S
        value: "120"

      # The same Render PostgreSQL instance stores Yakasha app data and WAHA
      # session records, using their respective table/schema namespaces.
      - key: DATABASE_URL
        fromDatabase:
          name: yakasha-sap-db
          property: connectionString
      - key: WHATSAPP_SESSIONS_POSTGRESQL_URL
        fromDatabase:
          name: yakasha-sap-db
          property: connectionString

      # Free-instance safety defaults. Raise only after capacity testing.
      - key: MAX_ACTIVE_LINKS
        value: "1"
      - key: PAIRING_READY_TIMEOUT_MS
        value: "90000"
      - key: ADMIN_TOKEN_TTL_SECONDS
        value: "604800"
      - key: DB_POOL_MAX
        value: "2"
      - key: REQUEST_BODY_LIMIT
        value: 32kb
      - key: MEDIA_MAX_BYTES
        value: "8388608"
      - key: MEDIA_REQUEST_BODY_LIMIT
        value: 12mb

      # Render provides PORT and RENDER_EXTERNAL_URL automatically. The backend
      # builds callback URLs from RENDER_EXTERNAL_URL, so no public URL is needed.

databases:
  - name: yakasha-sap-db
    databaseName: yakasha_sap
    user: yakasha_sap
    plan: free
    region: frankfurt
    ipAllowList: []
